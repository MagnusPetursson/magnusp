# Icelandic site, built to site/is/ (served at https://magnusp.is/is/).
# Build AFTER the English site: zensical build -f zensical.is.toml
# Mirrors zensical.toml; keep shared settings (theme, features, palette,
# fonts) in sync. Stylesheets and images are NOT duplicated: they are served
# from the English build by absolute URL (/stylesheets/..., /images/...).

[project]
site_name = "Magnús Pétursson"
site_description = "Ferilskrá og verkefni Magnúsar Péturssonar."
site_author = "Magnús Pétursson"
site_url = "https://magnusp.is/is/"
repo_url = "https://github.com/MagnusPetursson/magnusp"
repo_name = "MagnusPetursson/magnusp"
copyright = "&copy; 2026 Magnús Pétursson"

docs_dir = "docs-is"
site_dir = "site/is"

nav = [
    { "Forsíða" = "index.md" },
    { "Um mig" = "about.md" },
    { "Verkefni" = "projects.md" },
    { "Reynsla" = "experience.md" },
    { "Hæfni" = "skills.md" },
    { "Hafa samband" = "contact.md" },
]

extra_css = ["/stylesheets/extra.css"]

[project.theme]
language = "is"
features = [
    "announce.dismiss",
    "content.code.copy",
    "content.footnote.tooltips",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.sections",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
]

[[project.theme.palette]]
scheme = "default"
primary = "black"
accent = "blue"
toggle.icon = "lucide/sun"
toggle.name = "Skipta í dökkt útlit"

[[project.theme.palette]]
scheme = "slate"
primary = "black"
accent = "blue"
toggle.icon = "lucide/moon"
toggle.name = "Skipta í ljóst útlit"

[project.theme.font]
text = "Roboto"
code = "Roboto Mono"

[[project.extra.alternate]]
name = "English"
link = "/"
lang = "en"

[[project.extra.alternate]]
name = "Íslenska"
link = "/is/"
lang = "is"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/MagnusPetursson"
name = "GitHub"
