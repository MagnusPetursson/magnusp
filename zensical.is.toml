# Icelandic site, built to site/is/ (served at https://magnusp.is/is/).
# Build AFTER the English site: zensical build -f zensical.is.toml
# Stylesheets and images are not duplicated: pages load them from the English
# build by absolute URL (/stylesheets/..., /images/...).
# Keep the theme, plugins and extra sections in sync with zensical.toml.

[project]
site_name = "Magnús Pétursson"
site_description = "Magnús Pétursson hannar, smíðar og kennir: rafeindatækni, stafræn framleiðsla og reikniritalist."
site_author = "Magnús Pétursson"
site_url = "https://magnusp.is/is/"
copyright = "&copy; 2026 Magnús Pétursson"

docs_dir = "docs-is"
site_dir = "site/is"

nav = [
    { "Forsíða" = "index.md" },
    { "Verkefni" = [
        "projects/index.md",
        "projects/mccompass.md",
        "projects/glasslight.md",
        "projects/pfb-studio.md",
    ] },
    { "Um mig" = "about.md" },
    { "Hafa samband" = "contact.md" },
]

extra_css = ["/stylesheets/extra.css"]
extra_javascript = ["/javascripts/site.js"]

[project.theme]
custom_dir = "overrides"
font = false  # self-hosted in docs/fonts/, declared in extra.css
language = "is"
favicon = "/images/favicon.svg"
features = [
    "content.code.copy",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.tabs",
    "navigation.top",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/moon"
toggle.name = "Skipta í dökkt útlit"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/sun"
toggle.name = "Skipta í ljóst útlit"


[project.theme.icon]
menu = "lucide/menu"
top = "lucide/arrow-up"

[project.plugins.search]
enabled = false

[project.extra]
generator = false

# GoatCounter analytics: the site code from magnusp.goatcounter.com. Leave empty to load
# no analytics. GoatCounter ignores localhost, so local previews aren't counted.
goatcounter = "magnusp"

# Contact form (Formspree). Until `action` is set, the contact page shows a placeholder.
# `fields` become hidden inputs; _subject sets the subject of the email Formspree sends.
[project.extra.contact_form]
action = "https://formspree.io/f/mrpbdand"
fields = { _subject = "Skilaboð af magnusp.is" }

# Language switcher: the header links each page to the same page in the other language.
[[project.extra.alternate]]
name = "English"
link = "/"
lang = "en"

[[project.extra.alternate]]
name = "Íslenska"
link = "/is/"
lang = "is"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/MagnusPetursson"
name = "GitHub"
